name: snake

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#e2231a&color_dots=#ebe9e3,#f5c2be,#ee8a83,#e2231a,#8f140e
            dist/snake-dark.svg?palette=github-dark&color_snake=#e2231a&color_dots=#161b22,#4d1814,#82201a,#c0231b,#ff4a3d
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
