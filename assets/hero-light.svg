<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Brandon Magana. Offline AI agents, knowledge graphs, and systems that run where the network does not reach.">
<style>
  .g { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .ink { fill: #0b0b0b; }
  .dim { fill: #0b0b0b8c; }
  .red { fill: #e2231a; }
  .cap { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
</style>
<style>
  @keyframes l0 { 0%, 4.28% { opacity: 0 } 4.29%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l1 { 0%, 12.13% { opacity: 0 } 12.14%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l2 { 0%, 19.99% { opacity: 0 } 20.00%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l3 { 0%, 27.85% { opacity: 0 } 27.86%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l4 { 0%, 35.70% { opacity: 0 } 35.71%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l5 { 0%, 43.56% { opacity: 0 } 43.57%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
@keyframes l6 { 0%, 51.42% { opacity: 0 } 51.43%, 94% { opacity: 1 } 97%, 100% { opacity: 0 } }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes live { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  .n1 { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .n2 { animation: rise .7s .12s cubic-bezier(.2,.7,.2,1) both; }
  .ld { animation: rise .7s .3s cubic-bezier(.2,.7,.2,1) both; }
</style>
<rect width="1000" height="440" fill="#f2f0ea"/>

